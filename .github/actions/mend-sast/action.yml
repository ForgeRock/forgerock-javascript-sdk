    #     if [ "$MEND_SAST_CRITICAL_COUNT" -gt 0 ] || [ "$MEND_SAST_HIGH_COUNT" -gt 0 ]; then
    #       echo "conclusion=failure" >> $GITHUB_OUTPUT
    #     else
    #       echo "conclusion=success" >> $GITHUB_OUTPUT
    #     fi

    # Step 2: Publish Mend SAST Check
    # - name: Publish Mend SAST Check
    #   uses: actions/github-script@v9
    #   env:
    #     REPORT_NAME: ${{ inputs.MEND_SAST_REPORT_NAME }}
    #   with:
    #     script: |
    #       const fs = require('fs');
    #       const body = fs.readFileSync(process.env.REPORT_NAME + '.txt', 'utf8');

    #       await github.rest.checks.create({
    #         owner: context.repo.owner,
    #         repo: context.repo.repo,
    #         name: "Mend SAST Report",
    #         head_sha: '${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}',
    #         status: "completed",
    #         conclusion: "${{ steps.sast_conclusion.outputs.conclusion }}",
    #         output: {
    #           title: "Mend SAST Report",
    #           summary: `Critical: ${process.env.MEND_SAST_CRITICAL_COUNT}, High: ${process.env.MEND_SAST_HIGH_COUNT}`,
    #           text: "```\n" + body + "\n```"
    #         }
    #       });

    - name: Upload SAST scan report
      uses: actions/upload-artifact@v7
      with:
        name: mend-sast-report
        path: |
          ${{ inputs.MEND_SAST_REPORT_NAME }}.txt
          ${{ inputs.MEND_SAST_REPORT_NAME }}.json

