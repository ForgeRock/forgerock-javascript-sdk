    # Fail the job on Critical/High findings
    - name: Fail on Critical/High severity vulnerabilities
      shell: bash
      run: |
        if [ "$MEND_SAST_CRITICAL_COUNT" -gt 0 ] || [ "$MEND_SAST_HIGH_COUNT" -gt 0 ]; then
          echo "::error::Mend SAST scan found ${MEND_SAST_CRITICAL_COUNT} critical and ${MEND_SAST_HIGH_COUNT} high severity vulnerabilities. See the Mend SAST Report step summary for details."
          exit 1
        fi
        echo "No critical or high severity vulnerabilities found."
