name: Mend Scans for Release
on:
  workflow_dispatch:
    inputs:
      # When full_scan is off, only `packages/` are scanned by default
      full_scan:
        description: 'Scan full repo (optional)'
        required: false
        type: boolean
        default: false
      sast_report_name:
        description: 'Mend SAST scan report name'
        required: false
        default: 'Legacy_JS_SAST_Scan_Report'
        type: string
      sca_report_name:
        description: 'Mend SCA scan report name'
        required: false
        default: 'Legacy_JS_SCA_Scan_Report'
        type: string
env:
  MEND_EMAIL: ${{ secrets.MEND_EMAIL }}
  MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
  MEND_SERVER_URL: ${{ vars.MEND_SERVER_URL }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  mend-sast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ env.GH_TOKEN }}

      - name: Setup Mend
        uses: ./.github/actions/mend-setup

      - name: Mend SAST scan
        uses: ./.github/actions/mend-sast
        timeout-minutes: 10
        with:
          full_scan: ${{ inputs.full_scan }}
          MEND_SAST_REPORT_NAME: ${{ inputs.sast_report_name }}
          MEND_EMAIL: ${{ env.MEND_EMAIL }}
          MEND_USER_KEY: ${{ env.MEND_USER_KEY }}
          MEND_SERVER_URL: ${{ env.MEND_SERVER_URL }}

  mend-sca-scan:
    runs-on: ubuntu-latest
    # Force the Mend SCA scan to always run. It is run sequentially after the SAST scan instead of in parallel.
    needs: mend-sast-scan
    if: always()
    steps:
      - name: Clone the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ env.GH_TOKEN }}

      - name: Setup Mend
        uses: ./.github/actions/mend-setup

      - name: Mend SCA scan
        uses: ./.github/actions/mend-sca
        timeout-minutes: 10
        with:
          full_scan: ${{ inputs.full_scan }}
          MEND_SCA_REPORT_NAME: ${{ inputs.sca_report_name }}
          MEND_EMAIL: ${{ env.MEND_EMAIL }}
          MEND_USER_KEY: ${{ env.MEND_USER_KEY }}
          MEND_SERVER_URL: ${{ env.MEND_SERVER_URL }}
